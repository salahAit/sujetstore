<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">حَالَاتُ المَادَّةِ الثَّلَاثُ وَالاِنْصِهَارُ وَالتَّجَمُّدُ</text><rect x="310" y="52" width="132" height="168" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="376" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">الحالة الصلبة</text><text x="376" y="148" text-anchor="middle" font-size="10.2" fill="#334155">لها شكل وحجم ثابتان (جليد، خشب)</text><rect x="164" y="52" width="132" height="168" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/><text x="230" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">الحالة السائلة</text><text x="230" y="148" text-anchor="middle" font-size="10.2" fill="#334155">تأخذ شكل الإناء وتجري (ماء، زيت)</text><rect x="18" y="52" width="132" height="168" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="84" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">الحالة الغازية</text><text x="84" y="148" text-anchor="middle" font-size="10.2" fill="#334155">تنتشر وتملأ كل الحجم (هواء، بخار)</text></svg>
