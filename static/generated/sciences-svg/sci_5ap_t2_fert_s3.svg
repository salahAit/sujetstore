<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" width="440" height="215" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="203" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="220" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">تغذية النبات بالأملاح المعدنية وأثر التسميد في التربة</text><rect x="232" y="46" width="186" height="146" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/><text x="325" y="70" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#166534">الحقل (أ): تسميد عقلاني</text><text x="325" y="102" text-anchor="middle" font-size="10.2" fill="#14532d">سماد عضوي طبيعي (روث + دبال)</text><text x="325" y="128" text-anchor="middle" font-size="10.2" fill="#14532d">مع مقدار مدروس من الأملاح</text><text x="325" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">محصول وفير ومياه نقية ✓</text><rect x="22" y="46" width="186" height="146" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="115" y="70" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#92400e">الحقل (ب): دون تسميد</text><text x="115" y="106" text-anchor="middle" font-size="10.2" fill="#334155">تربة فقيرة من الأزوت والفوسفور</text><text x="115" y="136" text-anchor="middle" font-size="10.2" fill="#334155">نمو ضعيف واصفرار الأوراق</text><text x="115" y="168" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">نقص الأملاح المعدنية !</text></svg>
