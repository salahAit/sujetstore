<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="440" height="195" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="183" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="220" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">مَشْهَدٌ مِنَ المَرْجِ الطَّبِيعِيِّ</text><rect x="300" y="48" width="120" height="118" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><text x="360" y="74" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#166534">بُذُورٌ وَعُشْبٌ</text><text x="360" y="102" text-anchor="middle" font-size="10" fill="#334155">تَنْتُشُ بِالمَاءِ وَالدِّفْءِ</text><text x="360" y="124" text-anchor="middle" font-size="10" fill="#15803d">وَتَمْتَصُّ الأَمْلَاحَ</text><rect x="160" y="48" width="120" height="118" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="220" y="74" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#92400e">أَرْنَبٌ وَطَائِرٌ</text><text x="220" y="102" text-anchor="middle" font-size="10" fill="#334155">الأَرْنَبُ يَقْفِزُ</text><text x="220" y="124" text-anchor="middle" font-size="10" fill="#b45309">وَالطَّائِرُ يَطِيرُ</text><rect x="20" y="48" width="120" height="118" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><text x="80" y="74" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#991b1b">ثَعْلَبٌ لَاحِمٌ</text><text x="80" y="102" text-anchor="middle" font-size="10" fill="#334155">عُشْبٌ ← أَرْنَبٌ ← ثَعْلَبٌ</text><text x="80" y="124" text-anchor="middle" font-size="10" fill="#dc2626">سِلْسِلَةٌ غِذَائِيَّةٌ</text></svg>
