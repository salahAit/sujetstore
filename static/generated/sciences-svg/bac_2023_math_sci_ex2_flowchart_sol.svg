<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 314" width="465" height="314" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><defs><marker id="flArrV" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker></defs><rect x="8" y="8" width="449" height="298" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="232.5" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مخطط تحصيلي لتأثير الحموضة ودرجة الحرارة على البنية الفراغية والنشاط الإنزيمي</text><rect x="34" y="44" width="397" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.7"/><text x="232.5" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">أولاً: الظروف المثلى للنشاط الإنزيمي</text><text x="232.5" y="80" text-anchor="middle" font-size="10.5" fill="#334155">حالة تأين مثلى لجذور أحماض الموقع الفعال واستقرار كامل للروابط المثبتة للبنية</text><line x1="232.5" y1="88" x2="232.5" y2="110" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">تكامل بنيوي محفّز</text><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">تكامل بنيوي محفّز</text><rect x="34" y="112" width="397" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="232.5" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">ثانياً: تشكّل المعقد الإنزيمي وحدوث التحفيز الأعظمي</text><text x="232.5" y="148" text-anchor="middle" font-size="10.5" fill="#334155">نشأة روابط انتقالية بين الركيزة وموقع التثبيت وتحوّلها سريعاً إلى ناتج التفاعل</text><line x1="232.5" y1="156" x2="232.5" y2="178" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">عند الابتعاد عن الظروف المثلى</text><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">عند الابتعاد عن الظروف المثلى</text><rect x="34" y="180" width="397" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/><text x="232.5" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">ثالثاً: تأثير تغيّر درجة الحموضة نحو التطرف الحامضي أو القاعدي</text><text x="232.5" y="216" text-anchor="middle" font-size="10.5" fill="#334155">تغيّر الشحنة الكهربائية لجذور الأحماض الأمينية يعيق تشكّل المعقد ويُفقد الموقع الفعال نشاطه</text><line x1="232.5" y1="224" x2="232.5" y2="246" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">تأثير تغيّر درجة الحرارة</text><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">تأثير تغيّر درجة الحرارة</text><rect x="34" y="248" width="397" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.7"/><text x="232.5" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">رابعاً: تأثير البرودة مقابل الحرارة المرتفعة</text><text x="232.5" y="284" text-anchor="middle" font-size="10.5" fill="#334155">البرودة تحدث تثبيطاً عكوساً بتباطؤ الجزيئات والحرارة المرتفعة تخرّب البنية بشكل غير عكوس</text></svg>
