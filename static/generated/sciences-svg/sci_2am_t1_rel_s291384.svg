<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 225" width="460" height="225" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="213" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">أمثلة للعلاقات الحيوية وتنظيم مجتمع النحل</text><rect x="24" y="44" width="412" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="230" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">المثال المدروس:</text><text x="230" y="88" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#0f172a">تعاون الملكة والذكور والعاملات داخل خلية النحل وتقاسم المهام</text><rect x="304" y="118" width="132" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="370" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">ملكة النحل</text><text x="370" y="166" text-anchor="middle" font-size="9.6" fill="#334155">واحدة خصبة</text><text x="370" y="186" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#7f1d1d">وضع البيض</text><rect x="164" y="118" width="132" height="86" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="230" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">العاملات</text><text x="230" y="166" text-anchor="middle" font-size="9.6" fill="#334155">إناث عقيمة</text><text x="230" y="186" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#78350f">جمع الرحيق والحراسة</text><rect x="24" y="118" width="132" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="90" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">الذكور</text><text x="90" y="166" text-anchor="middle" font-size="9.6" fill="#334155">بضع مئات</text><text x="90" y="186" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#1e3a8a">تلقيح الملكة</text></svg>
