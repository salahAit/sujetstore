<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="440" height="195" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="183" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="220" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">تَحْضِيرُ الكَعْكَةِ فِي مَطْبَخِ عَائِلَةِ آدَمُ</text><rect x="300" y="48" width="120" height="118" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="360" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#92400e">1. المِيزَانُ</text><text x="360" y="106" text-anchor="middle" font-size="10" fill="#334155">قِيَاسُ كُتْلَةِ الدَّقِيقِ</text><text x="360" y="128" text-anchor="middle" font-size="10" fill="#b45309">وَالسُّكَّرِ وَالزُّبْدَةِ</text><rect x="160" y="48" width="120" height="118" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="220" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#991b1b">2. الاِنْصِهَارُ</text><text x="220" y="106" text-anchor="middle" font-size="10" fill="#334155">الزُّبْدَةُ الصَّلْبَةُ</text><text x="220" y="128" text-anchor="middle" font-size="10" fill="#dc2626">تَصِيرُ سَائِلَةً بِالحَرَارَةِ</text><rect x="20" y="48" width="120" height="118" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="80" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#1e3a8a">3. السَّاعَةُ</text><text x="80" y="106" text-anchor="middle" font-size="10" fill="#334155">مُرَاقَبَةُ وَقْتِ الطَّهْيِ</text><text x="80" y="128" text-anchor="middle" font-size="10" fill="#1d4ed8">نِصْفُ سَاعَةٍ</text></svg>
