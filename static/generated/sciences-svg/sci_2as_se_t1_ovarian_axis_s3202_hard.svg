<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 314" width="440" height="314" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><defs><marker id="flArrV" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker></defs><rect x="8" y="8" width="424" height="298" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="220" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">التنسيق العصبي الهرموني وحلقة المراقبة الرجعية للدورة المبيضية</text><rect x="34" y="44" width="372" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/><text x="220" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">1. تحت السرير البصري</text><text x="220" y="80" text-anchor="middle" font-size="10.5" fill="#334155">إفراز نبضي عصبي-هرموني نحو النخامية</text><line x1="220" y1="88" x2="220" y2="110" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><rect x="34" y="112" width="372" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="220" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">2. الفص الأمامي للنخامية</text><text x="220" y="148" text-anchor="middle" font-size="10.5" fill="#334155">إفراز مثيرات الغدد التناسلية في الدم</text><line x1="220" y1="156" x2="220" y2="178" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="230" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">طريق دموي</text><text x="230" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">طريق دموي</text><rect x="34" y="180" width="372" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.7"/><text x="220" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">3. المبيض (جريبات ثم جسم أصفر)</text><text x="220" y="216" text-anchor="middle" font-size="10.5" fill="#334155">تطوير الجريب ← الإباضة ← إفراز الأستراديول والبروجسترون</text><line x1="220" y1="224" x2="220" y2="246" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><rect x="34" y="248" width="372" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.7"/><text x="220" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">4. المراقبة الرجعية على المعقد</text><text x="220" y="284" text-anchor="middle" font-size="10.5" fill="#334155">سالبة (أغلب الدورة) وموجبة قبيل الإباضة</text></svg>
