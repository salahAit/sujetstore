<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="208" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="220" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">المبادلات الغازية في الرئتين والترشيح الدموي في الكليتين</text><rect x="232" y="44" width="186" height="156" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/><text x="325" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0369a1">1. الرئتان (مبادلات غازية)</text><circle cx="325" cy="112" r="24" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/><text x="325" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">حويصل رئوي</text><text x="325" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">دخول الأكسجين إلى الدم</text><text x="325" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">خروج غاز الفحم في الزفير</text><rect x="22" y="44" width="186" height="156" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="115" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">2. الكليتان (ترشيح الدم)</text><ellipse cx="96" cy="112" rx="14" ry="20" fill="#fca5a5" stroke="#991b1b" stroke-width="1.8"/><ellipse cx="134" cy="112" rx="14" ry="20" fill="#fca5a5" stroke="#991b1b" stroke-width="1.8"/><text x="115" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">تصفية الدم من الفضلات السامة</text><text x="115" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">تكوين البول وطرحه عبر المثانة</text></svg>
