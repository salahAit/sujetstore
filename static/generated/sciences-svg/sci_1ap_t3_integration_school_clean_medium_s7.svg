<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="440" height="195" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="183" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="220" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">يَوْمُ السَّبْتِ: حَمْلَةُ تَنْظِيفِ حَدِيقَةِ المَدْرَسَةِ</text><rect x="298" y="48" width="122" height="118" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="359" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#1e3a8a">مَوَادُّ صَلْبَةٌ وَسَائِلَةٌ</text><text x="359" y="106" text-anchor="middle" font-size="10" fill="#334155">دَلْوُ مَاءٍ (سَائِلٌ)</text><text x="359" y="128" text-anchor="middle" font-size="10" fill="#334155">مِكْنَسَةٌ وَحَجَرٌ (صَلْبٌ)</text><rect x="159" y="48" width="122" height="118" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="220" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#166534">الذَّوَبَانُ</text><text x="220" y="106" text-anchor="middle" font-size="10" fill="#334155">سُكَّرٌ فِي المَاءِ يَذُوبُ</text><text x="220" y="128" text-anchor="middle" font-size="10" fill="#334155">رَمْلُ السَّاحَةِ لَا يَذُوبُ</text><rect x="20" y="48" width="122" height="118" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="81" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#92400e">حِمَايَةُ البِيئَةِ</text><text x="81" y="106" text-anchor="middle" font-size="10" fill="#334155">نَرْمِي النُّفَايَاتِ</text><text x="81" y="128" text-anchor="middle" font-size="10" fill="#334155">فِي سَلَّةِ المُهْمَلَاتِ</text></svg>
