<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 255" width="460" height="255" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="243" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مخطط حلقة التنظيم الذاتي لتحلون الدم</text><rect x="160" y="42" width="140" height="36" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="230" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">تحلون الدم ≈ 1 g/L</text><rect x="264" y="102" width="172" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="350" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">إفراط سكري (&gt; 1 g/L)</text><text x="350" y="142" text-anchor="middle" font-size="10" fill="#7f1d1d">خلايا β (لانغرهانس) ← أنسولين</text><rect x="264" y="182" width="172" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="350" y="201" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">تخزين الغلوكوز (غليكوجين)</text><text x="350" y="218" text-anchor="middle" font-size="9.5" fill="#1e40af">في الكبد والعضلات والنسيج الدهني</text><rect x="24" y="102" width="172" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="110" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">قصور سكري (&lt; 1 g/L)</text><text x="110" y="142" text-anchor="middle" font-size="10" fill="#78350f">خلايا α (لانغرهانس) ← غلوكاغون</text><rect x="24" y="182" width="172" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="110" y="201" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">إماهة الغليكوجين الكبدي</text><text x="110" y="218" text-anchor="middle" font-size="9.5" fill="#14532d">تحرير الغلوكوز في الدم</text>