<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 314" width="465" height="314" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><defs><marker id="flArrV" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker></defs><rect x="8" y="8" width="449" height="298" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="232.5" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مخطط تحصيلي للدور المحوري للخلايا المساعدة وأثر الفيروس والعلاج</text><rect x="34" y="44" width="397" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="232.5" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">أولاً: تنشيط الخلايا اللمفاوية المساعدة</text><text x="232.5" y="80" text-anchor="middle" font-size="10.5" fill="#334155">بعد العرض من الخلية البالعة تتكاثر وتتمايز وتفرز المبلغ الكيميائي المحفّز</text><line x1="232.5" y1="88" x2="232.5" y2="110" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">التعاون المناعي عبر الإنترلوكين الثاني</text><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">التعاون المناعي عبر الإنترلوكين الثاني</text><rect x="34" y="112" width="397" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.7"/><text x="232.5" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">ثانياً: تحفيز الاستجابتين المناعيتين الخلطية والخلوية معاً</text><text x="232.5" y="148" text-anchor="middle" font-size="10.5" fill="#334155">تحفيز تكاثر وتمايز البائية إلى بلاسموسيت والتائية الثامنة إلى خلايا سامة</text><line x1="232.5" y1="156" x2="232.5" y2="178" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">عند الإصابة بفيروس فقدان المناعة المكتسبة</text><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">عند الإصابة بفيروس فقدان المناعة المكتسبة</text><rect x="34" y="180" width="397" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.7"/><text x="232.5" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">ثالثاً: تدمير الخلايا المساعدة بالنسخ العكسي والتكاثر الفيروسي</text><text x="232.5" y="216" text-anchor="middle" font-size="10.5" fill="#334155">هبوط تعداد الخلايا المساعدة دون العتبة الحرجة يسبب غياب التحفيز وانهيار المناعة</text><line x1="232.5" y1="224" x2="232.5" y2="246" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">تدخل الدواء المثبط للنسخ العكسي</text><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">تدخل الدواء المثبط للنسخ العكسي</text><rect x="34" y="248" width="397" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/><text x="232.5" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">رابعاً: كبح تكاثر الفيروس واستعادة المناعة</text><text x="232.5" y="284" text-anchor="middle" font-size="10.5" fill="#334155">إيقاف استطالة الحمض النووي الفيروسي فتتراجع الشحنة الفيروسية ويرتفع تعداد الخلايا المساعدة</text></svg>
