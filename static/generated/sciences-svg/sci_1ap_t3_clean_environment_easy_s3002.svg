<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="408" height="178" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="210" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">تَصَرُّفٌ تِجَاهَ البِيئَةِ وَالنَّظَافَةِ</text><rect x="26" y="50" width="368" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="210" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">يَرْمِي آدَمُ القُمَامَةَ عَلَى أَرْضِ السَّاحَةِ وَيَتْرُكُ حَنَفِيَّةَ المَاءِ مَفْتُوحَةً.</text><text x="210" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">هَلْ هَذَا سُلُوكٌ صَحِيحٌ يَحْمِي البِيئَةَ؟</text></svg>
