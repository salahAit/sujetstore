<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 314" width="465" height="314" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><defs><marker id="flArrV" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker></defs><rect x="8" y="8" width="449" height="298" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="232.5" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مخطط تحصيلي لمراحل التنفس الخلوي والتخمر وموقع تثبيط السيانور</text><rect x="34" y="44" width="397" height="44" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.7"/><text x="232.5" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">أولاً: التحلل السكري في الهيولى الأساسية</text><text x="232.5" y="80" text-anchor="middle" font-size="10.5" fill="#334155">أكسدة الغلوكوز إلى جزيئتي حمض البيروفيك وإنتاج نواقل مرجعة وجزيئتي طاقة</text><line x1="232.5" y1="88" x2="232.5" y2="110" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">عند غياب الأكسجين أو التثبيط: تخمر كحولي (إيثانول ومردود ضعيف)</text><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">عند غياب الأكسجين أو التثبيط: تخمر كحولي (إيثانول ومردود ضعيف)</text><rect x="34" y="112" width="397" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="232.5" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">ثانياً: حلقة كريبس في المادة الأساسية للميتوكوندري</text><text x="232.5" y="148" text-anchor="middle" font-size="10.5" fill="#334155">هدم كلي لحمض البيروفيك مع طرح ثنائي أكسيد الكربون وإنتاج نواقل مرجعة غزيرة</text><line x1="232.5" y1="156" x2="232.5" y2="178" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">انتقال النواقل المرجعة إلى الأعراف</text><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">انتقال النواقل المرجعة إلى الأعراف</text><rect x="34" y="180" width="397" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/><text x="232.5" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">ثالثاً: السلسلة التنفسية والفسفرة التأكسدية في الأعراف</text><text x="232.5" y="216" text-anchor="middle" font-size="10.5" fill="#334155">أكسدة النواقل وضخ البروتونات وإرجاع ثنائي الأكسجين إلى ماء مع تركيب غزير للطاقة</text><line x1="232.5" y1="224" x2="232.5" y2="246" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">موقع تثبيط السيانور: شل المعقد الرابع ومنع إرجاع ثنائي الأكسجين</text><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">موقع تثبيط السيانور: شل المعقد الرابع ومنع إرجاع ثنائي الأكسجين</text><rect x="34" y="248" width="397" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.7"/><text x="232.5" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">رابعاً: الحصيلة الطاقوية وعواقب التسمم بالسيانور</text><text x="232.5" y="284" text-anchor="middle" font-size="10.5" fill="#334155">التنفس السليم يحرر طاقة عالية مقارنة بالتخمر الذي يعطي مردوداً ضعيفاً جداً</text></svg>
