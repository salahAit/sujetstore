<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="440" height="195" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="183" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="220" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">يَوْمُ مَرْيَمُ الصِّحِّيُّ فِي البَيْتِ وَالمَدْرَسَةِ</text><rect x="304" y="48" width="116" height="118" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="362" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">1. الصَّبَاحُ</text><text x="362" y="106" text-anchor="middle" font-size="10.2" fill="#334155">فُطُورٌ صِحِّيٌّ</text><text x="362" y="128" text-anchor="middle" font-size="10.2" fill="#334155">وَتَنْظِيفُ الأَسْنَانِ</text><rect x="162" y="48" width="116" height="118" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="220" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">2. المَدْرَسَةُ</text><text x="220" y="106" text-anchor="middle" font-size="10.2" fill="#334155">رُؤْيَةُ السَّبُّورَةِ</text><text x="220" y="128" text-anchor="middle" font-size="10.2" fill="#334155">وَالجَرْيُ فِي السَّاحَةِ</text><rect x="20" y="48" width="116" height="118" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="78" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">3. المَسَاءُ</text><text x="78" y="106" text-anchor="middle" font-size="10.2" fill="#334155">عَشَاءٌ خَفِيفٌ</text><text x="78" y="128" text-anchor="middle" font-size="10.2" fill="#334155">وَنَوْمٌ بَاكِرٌ لِلنُّمُوِّ</text><text x="291" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">←</text><text x="149" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">←</text></svg>
