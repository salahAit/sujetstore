<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" width="460" height="230" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="218" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">السند 2: مقارنة بيتين بلاستيكيين لزراعة الفلفل</text><rect x="242" y="44" width="198" height="168" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="341" y="66" text-anchor="middle" font-size="11.8" font-weight="bold" fill="#991b1b">البيت البلاستيكي أ (مردود ضعيف)</text><text x="341" y="96" text-anchor="middle" font-size="10" fill="#0f172a">• غطاء متسخ يحجب الضوء</text><text x="341" y="122" text-anchor="middle" font-size="10" fill="#0f172a">• سماد مركز جداً (20 في الألف)</text><text x="341" y="148" text-anchor="middle" font-size="10" fill="#0f172a">• مغلق كلياً دون تهوية</text><text x="341" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">أوراق صفراء وثمار صغيرة</text><rect x="20" y="44" width="198" height="168" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/><text x="119" y="66" text-anchor="middle" font-size="11.8" font-weight="bold" fill="#166534">البيت البلاستيكي ب (مردود وفير)</text><text x="119" y="96" text-anchor="middle" font-size="10" fill="#0f172a">• غطاء شفاف نظيف (إضاءة جيدة)</text><text x="119" y="122" text-anchor="middle" font-size="10" fill="#0f172a">• سماد متوازن (2 في الألف)</text><text x="119" y="148" text-anchor="middle" font-size="10" fill="#0f172a">• تهوية منتظمة لتجديد الهواء</text><text x="119" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">نمو قوي وثمار كبيرة وحلوة</text></svg>
