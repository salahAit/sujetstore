<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 195" width="420" height="195" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="408" height="183" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="210" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">تَجْرِبَةُ لِينَا: وَضْعُ السُّكَّرُ فِي المَاءِ</text><rect x="158" y="48" width="104" height="96" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2.2"/><rect x="160" y="76" width="100" height="66" rx="6" fill="#bae6fd"/><line x1="210" y1="36" x2="210" y2="112" stroke="#475569" stroke-width="3" stroke-linecap="round"/><text x="210" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">مَاءٌ + السُّكَّرُ</text><text x="210" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">مَاءٌ + السُّكَّرُ</text><text x="210" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">بَعْدَ التَّحْرِيكِ بِالمِلْعَقَةِ: هَلْ يَذُوبُ أَمْ لَا يَذُوبُ؟</text><text x="210" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">بَعْدَ التَّحْرِيكِ بِالمِلْعَقَةِ: هَلْ يَذُوبُ أَمْ لَا يَذُوبُ؟</text></svg>
