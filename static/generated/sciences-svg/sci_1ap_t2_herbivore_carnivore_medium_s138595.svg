<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="408" height="178" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="210" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مَا نِظَامُ تَغْذِيَةِ هَذَا الحَيَوَانِ؟</text><rect x="234" y="54" width="160" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="314" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">الأَسَدُ</text><text x="314" y="118" text-anchor="middle" font-size="11" fill="#334155">يَأْكُلُ: اللَّحْمُ</text><text x="210" y="106" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">←</text><rect x="26" y="54" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="106" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">حَيَوَانٌ عَاشِبٌ</text><rect x="26" y="106" width="160" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="106" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">حَيَوَانٌ لَاحِمٌ</text><text x="210" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">العَاشِبُ يَأْكُلُ النَّبَاتَ — اللَّاحِمُ يَأْكُلُ اللَّحْمَ</text><text x="210" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#475569">العَاشِبُ يَأْكُلُ النَّبَاتَ — اللَّاحِمُ يَأْكُلُ اللَّحْمَ</text></svg>
