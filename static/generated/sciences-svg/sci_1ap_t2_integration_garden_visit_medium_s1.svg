<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="440" height="195" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="183" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="220" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">نُزْهَةُ وَسِيمُ فِي مَزْرَعَةِ الجَدِّ</text><rect x="300" y="48" width="120" height="118" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><text x="360" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">خَرُوفٌ وَأَرْنَبٌ</text><text x="360" y="106" text-anchor="middle" font-size="10.2" fill="#334155">حَيَوَانَاتٌ أَلِيفَةٌ</text><text x="360" y="128" text-anchor="middle" font-size="10.2" fill="#15803d">عَاشِبَةٌ تَأْكُلُ العُشْبَ</text><rect x="160" y="48" width="120" height="118" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/><text x="220" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0369a1">نَبْتَةٌ مَسْقِيَّةٌ</text><text x="220" y="106" text-anchor="middle" font-size="10.2" fill="#334155">تَمْتَصُّ المَاءَ</text><text x="220" y="128" text-anchor="middle" font-size="10.2" fill="#0369a1">بِوَاسِطَةِ الجُذُورِ</text><rect x="20" y="48" width="120" height="118" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><text x="80" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">جَرْيٌ وَلَعِبٌ</text><text x="80" y="106" text-anchor="middle" font-size="10.2" fill="#334155">هَوَاءٌ نَقِيٌّ</text><text x="80" y="128" text-anchor="middle" font-size="10.2" fill="#dc2626">تَسَارُعُ دَقَّاتِ القَلْبِ</text></svg>
