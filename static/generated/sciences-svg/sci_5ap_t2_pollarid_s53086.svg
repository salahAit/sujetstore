<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="208" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="220" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">التلقيح والإلقاح في الزهرة وتكيف النباتات مع الجفاف</text><rect x="232" y="44" width="186" height="156" rx="9" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/><text x="325" y="68" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#9d174d">تكاثر النبات الزهري</text><text x="325" y="98" text-anchor="middle" font-size="10" fill="#831843">1. التلقيح: انتقال حبوب الطلع</text><text x="325" y="122" text-anchor="middle" font-size="10" fill="#831843">2. الإلقاح: اتحاد مع البويضة</text><text x="325" y="150" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#15803d">البويضة ← بذرة</text><text x="325" y="174" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#d97706">المبيض ← ثمرة</text><rect x="22" y="44" width="186" height="156" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="115" y="68" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#92400e">تكيف نبات: الصبار والتين الشوكي</text><circle cx="115" cy="112" r="24" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><text x="115" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">وسط جاف</text><text x="115" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">أشواك لتقليص النتح وساق لحمية لتخزين الماء</text></svg>
