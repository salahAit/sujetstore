<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="203" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">بطاقة المعايير التشريحية للكائن الحي: الدلفين</text><rect x="34" y="46" width="392" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="230" y="65" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1e3a8a">1. يمتلك عموداً فقرياً (شعبة الفقاريات)</text><rect x="34" y="84" width="392" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="230" y="103" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1e3a8a">2. ولود وتُرضع الأنثى صغارها الحليب</text><rect x="34" y="122" width="392" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="230" y="141" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1e3a8a">3. يتنفس الهواء الجوي بواسطة رئتين</text></svg>
