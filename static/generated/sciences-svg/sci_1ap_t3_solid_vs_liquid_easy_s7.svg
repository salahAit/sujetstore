<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="408" height="178" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="210" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">صَنِّفِ المَوَادَّ: صَلْبَةٌ أَمْ سَائِلَةٌ؟</text><rect x="316" y="52" width="86" height="68" rx="9" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.7"/><text x="359" y="90" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#0f172a">الزَّيْتُ</text><rect x="218" y="52" width="86" height="68" rx="9" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.7"/><text x="261" y="90" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#0f172a">العَسَلُ السَّائِلُ</text><rect x="120" y="52" width="86" height="68" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.7"/><text x="163" y="90" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#0f172a">حَجَرٌ</text><rect x="22" y="52" width="86" height="68" rx="9" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.7"/><text x="65" y="90" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#0f172a">عَصِيرُ البُرْتُقَالِ</text><text x="210" y="156" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">الصَّلْبُ لَهُ شَكْلٌ ثَابِتٌ — السَّائِلُ يَسِيلُ وَيَأْخُذُ شَكْلَ الإِنَاءِ</text><text x="210" y="156" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1e3a8a">الصَّلْبُ لَهُ شَكْلٌ ثَابِتٌ — السَّائِلُ يَسِيلُ وَيَأْخُذُ شَكْلَ الإِنَاءِ</text></svg>
