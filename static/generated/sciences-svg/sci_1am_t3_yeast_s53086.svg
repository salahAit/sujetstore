<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 238" width="460" height="238" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مقارنة نشاط خميرة الخبز في الوسط الهوائي والوسط اللاهوائي</text><rect x="242" y="52" width="194" height="162" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="339" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">وسط هوائي (التنفس)</text><text x="339" y="108" text-anchor="middle" font-size="10.5" fill="#14532d">هدم كلي للغلوكوز بوجود O<tspan dy="3" font-size="72%">2</tspan></text><text x="339" y="136" text-anchor="middle" font-size="10.5" fill="#14532d">نواتج معدنية: CO<tspan dy="3" font-size="72%">2</tspan><tspan dy="-3">&#8203;</tspan> + H<tspan dy="3" font-size="72%">2</tspan><tspan dy="-3">&#8203;</tspan>O</text><text x="339" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">طاقة كبيرة (38 ATP) + تكاثر كبير</text><rect x="24" y="52" width="194" height="162" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="121" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">وسط لاهوائي (التخمر)</text><text x="121" y="108" text-anchor="middle" font-size="10.5" fill="#78350f">هدم جزئي للغلوكوز بغياب O<tspan dy="3" font-size="72%">2</tspan></text><text x="121" y="136" text-anchor="middle" font-size="10.5" fill="#78350f">إيثانول (مادة عضوية) + CO<tspan dy="3" font-size="72%">2</tspan></text><text x="121" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">طاقة ضئيلة (2 ATP) + تكاثر قليل</text></svg>
