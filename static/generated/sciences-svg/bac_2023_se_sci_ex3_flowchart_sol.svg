<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 314" width="465" height="314" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><defs><marker id="flArrV" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker></defs><rect x="8" y="8" width="449" height="298" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="232.5" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مخطط تحصيلي لآلية العلاج المناعي للأورام بالأجسام المضادة</text><rect x="34" y="44" width="397" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="232.5" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">أولاً: التعرف المزدوج وانتقاء الخلايا السامة</text><text x="232.5" y="80" text-anchor="middle" font-size="10.5" fill="#334155">ارتباط المستقبل الغشائي للخلية السامة بالببتيد السرطاني المعروض على الخلية الورمية</text><line x1="232.5" y1="88" x2="232.5" y2="110" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">في غياب العلاج يثبّط البروتين الورمي نشاط الخلية السامة</text><text x="242.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">في غياب العلاج يثبّط البروتين الورمي نشاط الخلية السامة</text><rect x="34" y="112" width="397" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/><text x="232.5" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">ثانياً: تدخل الجسم المضاد وحيد النسيلة</text><text x="232.5" y="148" text-anchor="middle" font-size="10.5" fill="#334155">تثبّت الجسم المضاد نوعياً على المستقبل المثبّط للخلية السامة عبر منطقته المتغيرة</text><line x1="232.5" y1="156" x2="232.5" y2="178" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">حجب الإشارة المثبطة</text><text x="242.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">حجب الإشارة المثبطة</text><rect x="34" y="180" width="397" height="44" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.7"/><text x="232.5" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">ثالثاً: رفع التثبيط واستعادة النشاط السام</text><text x="232.5" y="216" text-anchor="middle" font-size="10.5" fill="#334155">تنشيط إفراز حويصلات البرفورين والغرانزيم نحو غشاء الخلية السرطانية</text><line x1="232.5" y1="224" x2="232.5" y2="246" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">تشكيل قنوات حلولية</text><text x="242.5" y="239" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">تشكيل قنوات حلولية</text><rect x="34" y="248" width="397" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.7"/><text x="232.5" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">رابعاً: انحلال الخلية السرطانية وتراجع الورم</text><text x="232.5" y="284" text-anchor="middle" font-size="10.5" fill="#334155">دخول الماء والأملاح وتفجر الخلية الورمية ثم بلعمة الأشلاء الناتجة</text></svg>
