<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 246" width="455" height="246" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><defs><marker id="flArrV" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/></marker></defs><rect x="8" y="8" width="439" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="227.5" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">مراحل استهداف فيروس فقدان المناعة للخلايا اللمفاوية المساعدة</text><rect x="34" y="44" width="387" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.7"/><text x="227.5" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">أولاً: التثبيت والاختراق النوعي</text><text x="227.5" y="80" text-anchor="middle" font-size="10.5" fill="#334155">تكامل بنيوي بين الغليكوبروتين الغلافي الفيروسي والمستقبل الغشائي للخلية المساعدة</text><line x1="227.5" y1="88" x2="227.5" y2="110" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="237.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">حقن المادة الوراثية الفيروسية</text><text x="237.5" y="103" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">حقن المادة الوراثية الفيروسية</text><rect x="34" y="112" width="387" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/><text x="227.5" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">ثانياً: الاستنساخ العكسي</text><text x="227.5" y="148" text-anchor="middle" font-size="10.5" fill="#334155">تحويل الحمض النووي الريبي الفيروسي إلى حمض نووي منقوص الأكسجين بواسطة إنزيم النسخ العكسي</text><line x1="227.5" y1="156" x2="227.5" y2="178" stroke="#334155" stroke-width="1.8" marker-end="url(#flArrV)"/><text x="237.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">اندماج في نواة الخلية</text><text x="237.5" y="171" text-anchor="start" font-size="10" font-weight="bold" fill="#475569">اندماج في نواة الخلية</text><rect x="34" y="180" width="387" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/><text x="227.5" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">ثالثاً: التكاثر وتخريب الخلايا المساعدة</text><text x="227.5" y="216" text-anchor="middle" font-size="10.5" fill="#334155">تركيب فيروسات جديدة وتبرعمها ما يؤدي إلى موت الخلايا المساعدة وحدوث العجز المناعي</text></svg>
