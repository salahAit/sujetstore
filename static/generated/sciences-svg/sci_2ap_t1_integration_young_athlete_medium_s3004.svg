<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="440" height="195" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="428" height="183" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="220" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">بِطَاقَةُ الرِّيَاضِيِّ الصَّغِيرِ (سَارَةُ)</text><rect x="300" y="48" width="120" height="118" rx="9" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/><text x="360" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#0369a1">التَّنَفُّسُ</text><text x="360" y="106" text-anchor="middle" font-size="10" fill="#334155">شَهِيقٌ وَزَفِيرٌ</text><text x="360" y="128" text-anchor="middle" font-size="10" fill="#0369a1">فِي هَوَاءٍ نَقِيٍّ</text><rect x="160" y="48" width="120" height="118" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="220" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#991b1b">نَبْضُ القَلْبِ</text><text x="220" y="106" text-anchor="middle" font-size="10" fill="#334155">يَتَسَارَعُ عِنْدَ الجَرْيِ</text><text x="220" y="128" text-anchor="middle" font-size="10" fill="#dc2626">وَيَهْدَأُ فِي الرَّاحَةِ</text><rect x="20" y="48" width="120" height="118" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="80" y="76" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#166534">الغِذَاءُ وَالنَّظَافَةُ</text><text x="80" y="106" text-anchor="middle" font-size="10" fill="#334155">وَجْبَةٌ مُتَوَازِنَةٌ</text><text x="80" y="128" text-anchor="middle" font-size="10" fill="#15803d">تَنْظِيفُ الأَسْنَانِ</text></svg>
