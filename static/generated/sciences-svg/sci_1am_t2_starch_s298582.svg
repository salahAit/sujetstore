<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="208" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">نتيجة الكشف بماء اليود عن التركيب الضوئي (تغطية الورقة بغلاف أسود عاتم)</text><rect x="242" y="44" width="196" height="154" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/><text x="340" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">الورقة الشاهدة (كل الشروط)</text><ellipse cx="340" cy="118" rx="54" ry="28" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.6"/><text x="340" y="170" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#1e3a8a">تلون أزرق بنفسجي كامل</text><text x="340" y="188" text-anchor="middle" font-size="9.6" fill="#475569">تشكّل النشاء في وجود الضوء</text><rect x="22" y="44" width="196" height="154" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="120" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">الورقة التجريبية</text><ellipse cx="120" cy="118" rx="54" ry="28" fill="#fef08a" stroke="#0f172a" stroke-width="1.6"/><text x="120" y="170" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#b45309">لون بني مصفر (عدم تلون)</text><text x="120" y="188" text-anchor="middle" font-size="9.6" fill="#475569">غياب النشاء في غياب الضوء</text></svg>
