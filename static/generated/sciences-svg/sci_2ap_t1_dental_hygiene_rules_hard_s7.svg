<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="408" height="178" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="210" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">قَوَاعِدُ صِحَّةِ الأَسْنَانِ وَالجِسْمِ</text><rect x="24" y="50" width="372" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="210" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">يَسْتَعْمِلُ سَارَةُ فُرْشَاةَ أَسْنَانِ صَدِيقِهِ وَلَا يَزُورُ طَبِيبَ الأَسْنَانِ أَبَدًا.</text><text x="210" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">هَلْ هَذَا سُلُوكٌ صِحِّيٌّ سَلِيمٌ؟</text></svg>
