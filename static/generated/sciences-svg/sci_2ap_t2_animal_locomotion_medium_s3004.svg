<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">تَنَقُّلُ الحَيَوَانَاتِ وَتَكَيُّفُهَا مَعَ وَسَطِ عَيْشِهَا</text><rect x="310" y="52" width="132" height="168" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/><text x="376" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">الوسط المائي (السمكة)</text><text x="376" y="148" text-anchor="middle" font-size="10.2" fill="#334155">تنفس غلصمي + زعانف للسباحة + شكل مغزلي</text><rect x="164" y="52" width="132" height="168" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="230" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">الوسط الهوائي (الطائر)</text><text x="230" y="148" text-anchor="middle" font-size="10.2" fill="#334155">تنفس رئوي + أجنحة وريش وعظام خفيفة</text><rect x="18" y="52" width="132" height="168" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="84" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">الوسط الصحراوي (الجمل/الصبار)</text><text x="84" y="148" text-anchor="middle" font-size="10.2" fill="#334155">تقليص فقدان الماء (أشواك، سنام، جذور عميقة)</text></svg>
