<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="6" y="6" width="448" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="230" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">توضع الطبقات الرسوبية والمستحاثات المرشدة في عمود صخري</text><rect x="44" y="54" width="372" height="42" fill="#fef3c7" stroke="#57534e" stroke-width="1.5"/><text x="230" y="79" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1c1917">طبقة 1 (الأحدث): كلس + مستحاثات بحرية حديثة</text><rect x="44" y="96" width="372" height="44" fill="#fde68a" stroke="#57534e" stroke-width="1.5"/><text x="230" y="122" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1c1917">طبقة 2 (متوسطة): غضار + أمونيت (الحقب الثاني)</text><rect x="44" y="140" width="372" height="44" fill="#fed7aa" stroke="#57534e" stroke-width="1.5"/><text x="230" y="166" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1c1917">طبقة 3: حجر رملي + آثار قارية</text><rect x="44" y="184" width="372" height="44" fill="#d6d3d1" stroke="#57534e" stroke-width="1.5"/><text x="230" y="210" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#1c1917">طبقة 4 (الأقدم): شيست + ثلاثية الفصوص (الحقب الأول)</text></svg>
