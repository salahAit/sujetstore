<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="440" height="210" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="8" y="8" width="424" height="194" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="220" y="27" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">النواس المرن الأفقي الحر: x'' + (k/m)x = 0</text><defs><marker id="spArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker><marker id="axSpArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/></marker></defs><rect x="34" y="54" width="12" height="80" fill="#475569"/><line x1="34" y1="134" x2="396" y2="134" stroke="#0f172a" stroke-width="2"/><polyline fill="none" stroke="#1e3a8a" stroke-width="2" points="46,108 66,108 76,94 92,122 108,94 124,122 140,94 156,122 172,94 188,122 204,94 218,108 246,108"/><text x="145" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">ثابت المرونة k</text><rect x="246" y="86" width="54" height="47" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/><text x="273" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">m</text><line x1="210" y1="60" x2="210" y2="162" stroke="#059669" stroke-width="1.4" stroke-dasharray="4,3"/><text x="210" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">O (x=0)</text><line x1="273" y1="133" x2="273" y2="162" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/><text x="273" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">x &gt; 0</text><line x1="246" y1="108" x2="196" y2="108" stroke="#dc2626" stroke-width="2.2" marker-end="url(#spArr)"/><text x="220" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">T = −kx</text><line x1="60" y1="158" x2="390" y2="158" stroke="#0f172a" stroke-width="1.5" marker-end="url(#axSpArr)"/><text x="394" y="162" font-size="11" font-weight="bold">x</text><rect x="315" y="48" width="108" height="58" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="369" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">T₀ = 2π√(m/k)</text><text x="369" y="88" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">E_m = ½kX_m²</text></svg>
