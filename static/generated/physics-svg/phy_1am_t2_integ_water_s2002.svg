<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" font-family="Arabic Transparent" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="10" y="10" width="400" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><text x="210" y="28" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">وثيقة (1): ماء بئر عكر (رمل + زيت + ملح) + قطعة معدنية في القاع</text><rect x="28" y="48" width="170" height="115" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/><text x="113" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">عينة ماء البئر:</text><text x="113" y="88" text-anchor="middle" font-size="10" fill="#334155">1. طبقة زيت طافية</text><text x="113" y="106" text-anchor="middle" font-size="10" fill="#334155">2. ماء مالح عكر بالطمي</text><text x="113" y="124" text-anchor="middle" font-size="10" fill="#334155">3. قطعة معدن غائصة m=81g</text><text x="113" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">V₁=50 mL → V₂=80 mL</text><rect x="218" y="48" width="174" height="115" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/><text x="305" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">جدول المرجع (ρ):</text><text x="305" y="92" text-anchor="middle" font-size="10.5" fill="#0f172a">الألمنيوم: 2.7 g/cm³</text><text x="305" y="114" text-anchor="middle" font-size="10.5" fill="#0f172a">الحديد: 7.8 g/cm³</text><text x="305" y="136" text-anchor="middle" font-size="10.5" fill="#0f172a">النحاس: 8.9 g/cm³</text><text x="305" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">غليان الماء النقي: 100°C</text></svg>
