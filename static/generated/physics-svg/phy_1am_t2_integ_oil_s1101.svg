<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" style="background:#ffffff;font-family:'Arabic Transparent',Arial,sans-serif"><rect x="10" y="10" width="400" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="210" y="28" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">وثيقة: فصل زيت الزيتون عن الماء وتحضير محلول التخليل</text><polygon points="60,54 140,54 110,122 90,122" fill="#fef9c3" stroke="#0f172a" stroke-width="1.6"/><polygon points="72,88 128,88 110,122 90,122" fill="#bae6fd"/><line x1="100" y1="122" x2="100" y2="148" stroke="#0f172a" stroke-width="1.8"/><text x="100" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#854d0e">زيت (90g / 100cm³)</text><text x="100" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">ماء</text><text x="100" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">أنبوبة الإبانة</text><rect x="180" y="48" width="212" height="118" rx="6" fill="#f8fafc" stroke="#94a3b8"/><text x="286" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">تحضير محلول التمليح:</text><text x="286" y="92" text-anchor="middle" font-size="10.5" fill="#0f172a">كتلة الملح المنحل: 60 g</text><text x="286" y="112" text-anchor="middle" font-size="10.5" fill="#0f172a">حجم المحلول: 2 L</text><text x="286" y="134" text-anchor="middle" font-size="10.5" fill="#b45309">مكعب صلب ضلعه a = 3 cm</text><text x="286" y="152" text-anchor="middle" font-size="10.5" fill="#b45309">كتلته m = 24.3 g</text></svg>
