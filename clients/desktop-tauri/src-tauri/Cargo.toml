[package]
name = "sujetstore-desktop"
version = "1.0.0"
description = "SujetStore Desktop Application (Algerian Exams, Quizzes & Interactive Video Platform)"
authors = ["SujetStore Team"]
edition = "2021"

[lib]
name = "sujetstore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
