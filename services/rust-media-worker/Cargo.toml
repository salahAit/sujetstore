[package]
name = "sujetstore-rust-worker"
version = "0.1.0"
edition = "2021"
description = "SujetStore v6 high-performance PDF watermarking & Arabic VTT/SRT transcript normalization sidecar"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
